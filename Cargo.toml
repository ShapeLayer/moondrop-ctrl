[workspace]
resolver = "2"
members = [
    "crates/moondrop-core",
    "crates/moondrop-ffi",
    "crates/moondrop-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
moondrop-core = { path = "crates/moondrop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
